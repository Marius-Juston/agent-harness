# `uv run dev eval research` (#590): a fixed set of research questions with known answer notes.
# Each question: its merged answer note (whose cited works are the gold, evals/research/gold.json), its pre-research
# QUESTION.md, and the 8 opening queries a fresh tool-less model wrote from that question alone, never from the note.
# A1-A4: #192's queries (claude-opus-5-5, 2026-10-13); B5-B7: claude-opus-5-5, 2026-11-19, the same prompt
# (docs/research/_scratch/lit-recall/scripts/data/query_prompt.md, run_agent.py --batch 1). Do not edit the queries:
# a run is compared with an earlier one only while both read the same set.
