# Word budgets for text every agent (or every agent of a kind) loads. A raise needs evidence and owner approval: the
# gate refuses one against main unless a [[raise]] entry below names it and the owner approved it. Evidence: guidance
# helps when short and procedural (SkillsBench: compact skills +19 pts, comprehensive docs +0.7); adherence decays
# with instruction count.

[defaults]
agent = 600      # body + initialPrompt words of a .claude/agents/*.md
skill = 650      # body words of a SKILL.md, and separately of all its supporting files (key "<skill dir>/*")
                 # (compaction keeps only the first ~5,000 tokens of a skill)
context = 600    # CLAUDE.md/AGENTS.md plus the files they @-import: loaded into every session and subagent
                 # (CLAUDE.md also counts every .claude/rules/ file without `paths:`, which loads at launch;
                 # a rule with `paths:` has its own budget of this kind. A .claude/commands/ file: kind skill.)

[words]

# [[raise]]
# key = "words..claude/agents/builder.md"   # "<section>.<key>"
# to = 800
# reason = "why the text is needed and what it replaces"
# approved_by = "<owner GitHub login>"   # must equal the repository owner's login; the budget may rise up to `to`

# Test floors only rise; lowering one needs a [[raise]] (key "tests.<name>") whose `to` is the lowest value allowed.
# Coverage is a floor against a large drop, never a target; diff coverage is printed, never gated.
# Evidence: docs/research/test-floors-and-coverage.md.
[tests]
min_tests = 1021       # passed tests in the default gate run: 95% of 1075 (2026-10-12)
min_coverage = 81      # line % of devkit/ ([tool.coverage.run] source): 81.4% measured (2026-10-12)
