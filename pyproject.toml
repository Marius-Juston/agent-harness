[project]
name = "agent-harness"
version = "0.1.11"
description = "A harness for repositories worked on by many Claude Code agents: the devkit gate and board, a Claude Code plugin, and a Copier template."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# The gate's tools are dependencies, not a project's choice: every project pinned to one harness version runs the
# same checks with the same versions.
dependencies = [
    "pyyaml>=6.0.3",
    "pytest>=8.4",
    "pytest-xdist>=3.8",
    "pytest-randomly>=5.0.0",
    "hypothesis>=6.140",
    "ruff>=0.17",
    "actionlint-py>=1.7.12.25",
    "zizmor>=1.30.1",
    "pytest-cov>=7.1",
    "diff-cover>=10.6",
    "pytest-timeout>=2.4",
]

[project.urls]
Repository = "https://github.com/Marius-Juston/agent-harness"

[project.scripts]
dev = "devkit.cli:main"

[project.optional-dependencies]
semantic = [
    "model2vec>=0.10",
]

[dependency-groups]
dev = [
    "copier>=9.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devkit"]

# The plugin tree of this release, so a project's devkit can tell whether Claude Code loaded this build (#296): the
# marketplace installs a branch head under the manifest's version string. Read by devkit.setup.pinned_plugin_root.
[tool.hatch.build.targets.wheel.force-include]
"plugins/harness-ops" = "devkit/_plugin/harness-ops"

[tool.uv]
default-groups = ["dev"]

# This repository runs its own harness on itself: the plugin is its agent surface.
[tool.devkit]
surface = ["plugins/harness-ops"]
# The plugin and the template describe a consuming project's paths, which do not exist here.
path_check_skip = ["plugins/", "template/"]

# `dev integrate --local-ci`: what stands in for each required CI job when Actions cannot run (ci.yml's commands).
[tool.devkit.local_ci]
check = []
template = [["scripts/render_check.sh", "{tmpdir}/rendered-project"]]
plugin = [
    ["npx", "--yes", "@anthropic-ai/claude-code@2.1.296", "plugin", "validate", "--strict", "."],
    ["npx", "--yes", "@anthropic-ai/claude-code@2.1.296", "plugin", "validate", "--strict", "./plugins/harness-ops"],
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
# S603/S607 flag every subprocess call: running git, gh, uv and the gate's tools with argument lists (never a shell)
# is what devkit and the hooks do, so a per-call `noqa` would be noise.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts; fake tokens and seeded random generators are test fixtures, not secrets
"**/tests/**" = ["S101", "S105", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
xfail_strict = true  # an xfail test that starts passing fails the run (docs/research/test-suite-design.md)
markers = [
    "slow: long-running tests (run with `uv run dev test --slow`)",
    "live: needs network or a model; never in the default gate",
]

# Measured by the gate because .devkit/ratchets.toml sets [tests] min_coverage. The tests themselves do not count.
[tool.coverage.run]
source = ["devkit"]
