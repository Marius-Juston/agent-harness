name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
# Actions are pinned to commit hashes and checkout keeps no token: the gate's zizmor stage enforces both.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: gate (same command agents run)
        env:
          GH_TOKEN: ${{ github.token }} # reads the issue's weakening-ok approval
        run: uv run dev check --no-cache
  citations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false } # fetch-depth 0 already brings origin/main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: verify sources of changed research notes
        run: uv run dev cite-check
