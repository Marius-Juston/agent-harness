name: gate
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # weekly: new advisories against an unchanged lock (only the security steps run)
permissions:
  contents: read
  issues: read
concurrency:
  # One group per PR, or per commit otherwise: a merge never cancels main's verification of the merge before it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Actions are pinned to commit hashes and checkout keeps no token: the gate's zizmor stage enforces both.
# One job, so a PR bills one runner: the gate, the sources of changed research notes, then the security steps.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false } # every commit for gitleaks; origin/main for diffs
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        # pinned: audit-command and sbom-export are preview features whose flags may change
        with: { enable-cache: true, version: "0.12.23" }
      - if: github.event_name != 'schedule'
        run: uv sync --locked
      - name: gate (same command agents run)
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }} # reads the issue's weakening-ok approval
        run: uv run dev check --no-cache
      - name: per-test outcomes and durations of the gate's test run (for suite audits)
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # .git/devkit is the gate's state dir in a plain clone; hidden paths are skipped unless included
        with: { name: test-history, path: .git/devkit/test-history.jsonl, include-hidden-files: true }
      - name: verify sources of changed research notes (a no-op when none changed)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: uv run dev cite-check
      # Free stand-ins for GitHub secret scanning and dependency alerts, which private user-owned repositories do not
      # get: gitleaks over every commit, uv audit (OSV) over uv.lock, and a CycloneDX SBOM of uv.lock kept with the
      # run. Network-bound, so CI runs these rather than `dev check`. A false positive: add its fingerprint to
      # .gitleaksignore, or `--ignore <id>` to the audit with the reason beside it.
      - name: secrets in history (gitleaks, pinned in .pre-commit-config.yaml)
        if: ${{ !cancelled() }}
        run: uvx prek@0.5.3 run -c .pre-commit-config.yaml --hook-stage manual gitleaks-history --all-files
      - name: known vulnerabilities and yanked or deprecated packages (uv audit, OSV)
        if: ${{ !cancelled() }}
        run: uv audit --locked --preview-features audit-command
      - name: SBOM (CycloneDX 1.5 from uv.lock)
        if: ${{ !cancelled() }}
        run: uv export --frozen --format cyclonedx1.5 --preview-features sbom-export --quiet --output-file sbom.cdx.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: sbom, path: sbom.cdx.json, if-no-files-found: error }
